.aurora{position:absolute;inset:0;z-index:-1;overflow:hidden;pointer-events:none}

<script>
(function(){
  var root=document.documentElement,btn=document.getElementById('mode');
  document.getElementById('yr').textContent=new Date().getFullYear();
  function sync(){
    var dark=root.getAttribute('data-theme')==='dark';
    btn.setAttribute('aria-label',dark?'Switch to light mode':'Switch to dark mode');
    var m=document.querySelector('meta[name=theme-color]');if(m)m.setAttribute('content',dark?'#1C1E1F':'#FAF9F6');
  }
  sync();
  btn.addEventListener('click',function(){
    var n=root.getAttribute('data-theme')==='dark'?'light':'dark';
    root.setAttribute('data-theme',n);
    try{localStorage.setItem('fa-mode',n)}catch(e){}
    sync();
  });
})();
</script>
