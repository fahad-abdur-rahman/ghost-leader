<style>
:root{--bg:#06100b;--ink:#eaf3ee;--mute:#9db0a5;--g:#3FAE7C;--g1:#287A50;--g2:#7FDDB0;--line:rgba(127,221,176,.2);--ease:cubic-bezier(.2,.8,.2,1)}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Bengali",sans-serif;line-height:1.55;overflow-x:hidden}
a{color:inherit}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(60% 40% at 15% 10%,rgba(63,174,124,.28),transparent 70%),radial-gradient(50% 40% at 90% 80%,rgba(40,122,80,.3),transparent 70%),linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px) 0 0/44px 44px,linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px) 0 0/44px 44px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;max-width:560px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top)) 18px 6px}
.top a,.top button{font:600 .86rem inherit;color:var(--ink);text-decoration:none;background:none;border:1px solid rgba(255,255,255,.16);border-radius:99px;padding:7px 14px;cursor:pointer;transition:border-color .2s,color .2s,background .2s}
.top a:hover,.top button:hover,.top a:focus-visible,.top button:focus-visible{border-color:var(--g2);color:var(--g2);outline:none}
.lg{display:inline-flex;align-items:center;gap:9px;border:0!important;padding:0!important}
.lg b{display:grid;place-items:center;width:34px;height:34px;border-radius:11px;background:linear-gradient(135deg,var(--g1),var(--g));color:#fff;font-size:.75rem;letter-spacing:.02em;box-shadow:0 6px 16px rgba(40,122,80,.4)}
.lg span{font-weight:800;letter-spacing:.17em;font-size:.9rem}.lg i{font-style:normal;color:var(--g)}
main{max-width:560px;margin:0 auto;padding:8px 16px 40px}
.card{position:relative;border-radius:30px;padding:30px 24px 24px;background:linear-gradient(160deg,rgba(255,255,255,.07),rgba(255,255,255,.02));border:1px solid var(--line);box-shadow:0 30px 80px rgba(0,0,0,.5);backdrop-filter:blur(10px);transform-style:preserve-3d;transition:transform .25s ease-out;animation:rise .8s var(--ease) both}
.card::before{content:"";position:absolute;inset:-1px;border-radius:inherit;padding:1px;background:linear-gradient(140deg,rgba(127,221,176,.7),transparent 35%,transparent 65%,rgba(63,174,124,.6));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
@keyframes rise{from{opacity:0;transform:translateY(24px) scale(.97)}to{opacity:1;transform:none}}
.av{position:relative;width:132px;height:132px;margin:0 auto 16px;border-radius:50%;padding:4px;background:conic-gradient(from 0deg,var(--g2),var(--g1),var(--g),var(--g2));animation:spin 8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.av>div{width:100%;height:100%;border-radius:50%;overflow:hidden;background:#0c1a13;animation:spin 8s linear infinite reverse;display:grid;place-items:center;font-weight:800;font-size:2rem;color:var(--g2)}
.av img{width:100%;height:100%;object-fit:cover;object-position:50% 12%;display:block}
h1{margin:0;text-align:center;font-size:1.65rem;line-height:1.2;letter-spacing:-.01em}
.role{margin:6px 0 0;text-align:center;color:var(--g2);font-weight:700;font-size:.92rem}
.tag{margin:4px 0 18px;text-align:center;color:var(--mute);font-size:.92rem}
.acts{display:grid;gap:10px}
.btn{display:flex;align-items:center;gap:14px;padding:13px 16px;border-radius:16px;border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--ink);text-decoration:none;font:600 1rem inherit;cursor:pointer;text-align:left;width:100%;transition:transform .25s var(--ease),border-color .25s,background .25s,box-shadow .25s}
.btn:hover,.btn:focus-visible{transform:translateY(-2px);border-color:var(--g2);background:rgba(127,221,176,.09);box-shadow:0 10px 26px rgba(0,0,0,.3);outline:none}
.btn .ic{display:grid;place-items:center;width:40px;height:40px;border-radius:12px;background:rgba(127,221,176,.12);flex:none}
.btn svg{width:22px;height:22px;stroke:var(--g2);fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.btn small{display:block;color:var(--mute);font-weight:500;font-size:.8rem}
.btn.main{background:linear-gradient(135deg,var(--g1),var(--g));border-color:transparent;box-shadow:0 14px 32px rgba(40,122,80,.45)}
.btn.main .ic{background:rgba(255,255,255,.2)}.btn.main svg{stroke:#fff}.btn.main small{color:rgba(255,255,255,.8)}
.btn.wa{border-color:rgba(47,211,102,.4)}.btn.wa .ic{background:rgba(47,211,102,.14)}.btn.wa svg{stroke:#2fd366}
h2{margin:24px 0 10px;font-size:.74rem;font-weight:800;letter-spacing:.2em;text-transform:uppercase;color:var(--mute)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips a{padding:8px 14px;border-radius:99px;border:1px solid var(--line);text-decoration:none;font-weight:600;font-size:.88rem;transition:border-color .2s,color .2s,background .2s}
.chips a:hover,.chips a:focus-visible{border-color:var(--g2);color:var(--g2);background:rgba(127,221,176,.08);outline:none}
.qr{display:grid;justify-items:center;gap:12px;margin-top:6px;text-align:center}
.qr canvas{width:min(210px,62vw);height:auto;border-radius:16px;background:#fff;padding:10px;box-shadow:0 14px 36px rgba(0,0,0,.4)}
.qr p{margin:0;color:var(--mute);font-size:.85rem}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.row button{font:700 .86rem inherit;color:var(--ink);padding:9px 16px;border-radius:99px;background:rgba(255,255,255,.05);border:1px solid var(--line);cursor:pointer;transition:border-color .2s,color .2s}
.row button:hover,.row button:focus-visible{border-color:var(--g2);color:var(--g2);outline:none}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translate(-50%,16px);opacity:0;padding:11px 20px;border-radius:99px;background:#0e1a14;border:1px solid rgba(127,221,176,.45);font-weight:600;font-size:.9rem;transition:opacity .3s,transform .4s var(--ease);pointer-events:none;z-index:50}
.toast.on{opacity:1;transform:translate(-50%,0)}
footer{text-align:center;color:var(--mute);font-size:.82rem;padding:6px 16px calc(28px + env(safe-area-inset-bottom))}
@media(max-width:380px){.card{padding:26px 16px 20px}h1{font-size:1.45rem}}
@media(prefers-reduced-motion:reduce){.card,.av,.av>div{animation:none}}
</style>

    <h2 data-en="Scan to open this card" data-bn="এই কার্ড খুলতে স্ক্যান করুন">Scan to open this card</h2>
    <div class="qr">
      <canvas id="qr" width="10" height="10" aria-label="QR code of this card"></canvas>
      <div class="row"><button id="qrDl" type="button" data-en="Download QR" data-bn="QR নামান">Download QR</button><button id="share" type="button" data-en="Share this card" data-bn="কার্ড শেয়ার করুন">Share this card</button></div>
    </div>
  </section>
</main>
<footer>© <span id="yr">2026</span> Fahad Abdur Rahman · <a href="index.html" data-en="Visit my website" data-bn="আমার ওয়েবসাইটে যান">Visit my website</a></footer>
